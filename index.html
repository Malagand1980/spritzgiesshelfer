<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5fbf">
<meta name="description" content="Häufige Fehler im Spritzgießen – Lösungen nach Wirksamkeit sortiert.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Marcel’s Spritzgießhelfer</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --text: #1d2330;
    --muted: #5c6577;
    --line: #dde1e8;
    --accent: #1f5fbf;
    --accent-soft: #e6eefb;
    --hoch: #1b7f4b;
    --hoch-soft: #e2f4ea;
    --mittel: #a3660a;
    --mittel-soft: #fbf0dc;
    --gering: #6b7280;
    --gering-soft: #eef0f3;
    --done: #9aa3b2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #13161c;
      --panel: #1c2028;
      --text: #e6e9ef;
      --muted: #9aa3b2;
      --line: #2e3440;
      --accent: #6aa3ff;
      --accent-soft: #1f2b40;
      --hoch: #5fd394;
      --hoch-soft: #173326;
      --mittel: #f0b453;
      --mittel-soft: #3a2e17;
      --gering: #a0a8b6;
      --gering-soft: #2a2f38;
      --done: #5c6577;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px;
    padding-top: max(14px, env(safe-area-inset-top));
  }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

  .layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 16px;
    padding: 16px 20px;
    max-width: 1280px;
    margin: 0 auto;
  }
  .sidebar, .detail {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .sidebar { padding: 12px; align-self: start; position: sticky; top: 16px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
  .search {
    width: 100%;
    padding: 9px 12px;
    font: inherit;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .chip {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 3px 10px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .list { list-style: none; margin: 0; padding: 0; overflow-y: auto; }
  .list button {
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    padding: 9px 10px;
    border-radius: 7px;
    cursor: pointer;
    display: block;
  }
  .list button:hover { background: var(--bg); }
  .list button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .list small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
  .empty { color: var(--muted); padding: 10px; font-size: 13px; }

  .detail { padding: 22px 26px; min-width: 0; }
  .back { display: none; }
  .kat { color: var(--accent); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .detail h2 { margin: 2px 0 4px; font-size: 24px; }
  .alias { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .detail h3 { font-size: 15px; margin: 22px 0 8px; }
  .ursachen { margin: 0; padding-left: 20px; color: var(--muted); }

  .loesungen-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .reset { border: 0; background: none; color: var(--accent); cursor: pointer; font: inherit; font-size: 13px; padding: 0; }
  .loesungen { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .loesung {
    display: grid;
    grid-template-columns: 34px 1fr auto;
    gap: 12px;
    align-items: start;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 12px 14px;
  }
  .rang {
    width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 700; font-size: 14px;
    background: var(--accent-soft); color: var(--accent);
  }
  .loesung:first-child { border-color: var(--hoch); }
  .loesung:first-child .rang { background: var(--hoch); color: #fff; }
  .loesung .titel { font-weight: 600; }
  .loesung .info { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .tags { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .tag { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; font-weight: 600; }
  .w-hoch { background: var(--hoch-soft); color: var(--hoch); }
  .w-mittel { background: var(--mittel-soft); color: var(--mittel); }
  .w-gering { background: var(--gering-soft); color: var(--gering); }
  .art { background: var(--bg); color: var(--muted); font-weight: 500; border: 1px solid var(--line); }
  .check { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); }
  .loesung.done .titel, .loesung.done .info { color: var(--done); text-decoration: line-through; }
  .loesung.done .rang { opacity: .5; }

  .hinweis {
    margin-top: 24px;
    background: var(--bg);
    border-radius: 9px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .hinweis strong { color: var(--text); }
  .hinweis ul { margin: 6px 0 0; padding-left: 18px; }

  @media (max-width: 800px) {
    header { padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); }
    .layout { grid-template-columns: 1fr; padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    .sidebar { position: static; max-height: none; }
    .layout.show-detail .sidebar { display: none; }
    .layout:not(.show-detail) .detail { display: none; }
    .back { display: inline-block; border: 0; background: none; color: var(--accent); font: inherit; padding: 0; margin-bottom: 10px; cursor: pointer; }
    .detail { padding: 16px; }
    .loesung { grid-template-columns: 30px 1fr; }
    .loesung .check { grid-column: 2; }
  }
</style>
</head>
<body>
<header>
  <h1>Marcel’s Spritzgießhelfer</h1>
  <p>Häufige Fehler im Spritzgießen – Lösungen nach Wirksamkeit sortiert, die wirksamste zuerst.</p>
</header>

<div class="layout" id="layout">
  <aside class="sidebar">
    <input class="search" id="search" type="search" placeholder="Fehler suchen, z. B. Grat, Schlieren …" autocomplete="off">
    <div class="chips" id="chips"></div>
    <ul class="list" id="list"></ul>
  </aside>
  <main class="detail" id="detail"></main>
</div>

<script>
  const state = { filter: "Alle", query: "", aktiv: null };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

  // Abgehakte Maßnahmen (nur im eigenen Browser gespeichert)
  function ladeErledigt() {
    try { return JSON.parse(localStorage.getItem("fehlerhelfer-erledigt")) || {}; } catch { return {}; }
  }
  function speichereErledigt(obj) {
    try { localStorage.setItem("fehlerhelfer-erledigt", JSON.stringify(obj)); } catch {}
  }
  let erledigt = ladeErledigt();

  function renderChips() {
    $("chips").innerHTML = ["Alle", ...KATEGORIEN]
      .map((k) => `<button class="chip${k === state.filter ? " active" : ""}" data-k="${esc(k)}">${esc(k)}</button>`)
      .join("");
  }

  function gefiltert() {
    const q = norm(state.query.trim());
    return FEHLER.filter((f) => {
      if (state.filter !== "Alle" && f.kategorie !== state.filter) return false;
      if (!q) return true;
      return norm([f.name, ...f.alias, f.beschreibung].join(" ")).includes(q);
    });
  }

  function renderList() {
    const items = gefiltert();
    $("list").innerHTML = items.length
      ? items.map((f) => `<li><button data-id="${f.id}" class="${f.id === state.aktiv ? "active" : ""}">${esc(f.name)}<small>${esc(f.alias.slice(0, 2).join(" · "))}</small></button></li>`).join("")
      : `<li class="empty">Kein Fehler gefunden.</li>`;
  }

  function renderDetail() {
    const f = FEHLER.find((x) => x.id === state.aktiv);
    $("layout").classList.toggle("show-detail", !!f);
    if (!f) {
      $("detail").innerHTML = `<h2>Fehler auswählen</h2><p class="alias">Wähle links einen Fehler aus, um Ursachen und Lösungen zu sehen.</p>${grundregeln()}`;
      return;
    }
    const done = erledigt[f.id] || [];
    $("detail").innerHTML = `
      <button class="back" id="back">← Alle Fehler</button>
      <div class="kat">${esc(f.kategorie)}</div>
      <h2>${esc(f.name)}</h2>
      <div class="alias">Auch: ${esc(f.alias.join(", "))}</div>
      <p>${esc(f.beschreibung)}</p>

      <h3>Mögliche Ursachen</h3>
      <ul class="ursachen">${f.ursachen.map((u) => `<li>${esc(u)}</li>`).join("")}</ul>

      <div class="loesungen-head">
        <h3>Lösungen – wirksamste zuerst</h3>
        ${done.length ? `<button class="reset" id="reset">Haken zurücksetzen</button>` : ""}
      </div>
      <ol class="loesungen">
        ${f.loesungen.map((l, i) => `
          <li class="loesung${done.includes(i) ? " done" : ""}">
            <div class="rang">${i + 1}</div>
            <div>
              <div class="titel">${esc(l.massnahme)}</div>
              <div class="info">${esc(l.detail)}</div>
              <div class="tags">
                <span class="tag w-${l.wirkung}">Wirkung: ${l.wirkung}</span>
                <span class="tag art">${esc(l.art)}</span>
              </div>
            </div>
            <label class="check"><input type="checkbox" data-i="${i}"${done.includes(i) ? " checked" : ""}> probiert</label>
          </li>`).join("")}
      </ol>
      ${grundregeln()}`;
  }

  function grundregeln() {
    return `<div class="hinweis"><strong>Grundregeln bei der Fehlersuche</strong>
      <ul>
        <li>Immer nur <strong>einen</strong> Parameter gleichzeitig ändern und einige Zyklen abwarten, bis der Prozess stabil ist.</li>
        <li>Vorher prüfen: Massepolster vorhanden und konstant? Material richtig getrocknet? Temperaturen erreicht?</li>
        <li>Prozessmaßnahmen zuerst – Werkzeug- und Konstruktionsänderungen sind teurer und langwieriger.</li>
        <li>Verarbeitungsgrenzen laut Materialdatenblatt einhalten. Die Reihenfolge ist ein Erfahrungswert und kann je nach Material und Werkzeug abweichen.</li>
      </ul></div>`;
  }

  function zeige(id) {
    state.aktiv = id;
    try { history.replaceState(null, "", id ? "#" + id : location.pathname); } catch {}
    render();
    window.scrollTo(0, 0);
  }

  function render() { renderChips(); renderList(); renderDetail(); }

  function ausHash() {
    const id = decodeURIComponent(location.hash.slice(1));
    state.aktiv = FEHLER.some((f) => f.id === id) ? id : null;
    render();
    if (state.aktiv) window.scrollTo(0, 0);
  }

  $("search").addEventListener("input", (e) => { state.query = e.target.value; renderList(); });
  $("chips").addEventListener("click", (e) => {
    const k = e.target.closest(".chip")?.dataset.k;
    if (k) { state.filter = k; renderChips(); renderList(); }
  });
  $("list").addEventListener("click", (e) => {
    const id = e.target.closest("button")?.dataset.id;
    if (id) zeige(id);
  });
  $("detail").addEventListener("click", (e) => {
    if (e.target.id === "back") zeige(null);
    if (e.target.id === "reset") { delete erledigt[state.aktiv]; speichereErledigt(erledigt); renderDetail(); }
  });
  $("detail").addEventListener("change", (e) => {
    if (e.target.type !== "checkbox") return;
    const i = Number(e.target.dataset.i);
    const set = new Set(erledigt[state.aktiv] || []);
    e.target.checked ? set.add(i) : set.delete(i);
    erledigt[state.aktiv] = [...set];
    speichereErledigt(erledigt);
    renderDetail();
  });
  window.addEventListener("hashchange", ausHash);
  window.addEventListener("popstate", ausHash);

  // Offline-Funktion / Installierbarkeit (nur über http(s), nicht bei file://)
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  // Desktop: ersten Fehler direkt anzeigen
  if (!location.hash && window.matchMedia("(min-width: 801px)").matches) {
    state.aktiv = FEHLER[0].id;
    render();
  } else {
    ausHash();
  }
</script>
</body>
</html>
